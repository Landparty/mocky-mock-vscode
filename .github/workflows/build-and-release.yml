name: build-and-release

# Manually-triggered only. Installs the mockymock CLI release from PyPI
# (the "mockymock" project -- MOCKYMOCK_VERSION below, defaulting to
# src/environment/cliPackage.ts's MOCKYMOCK_CLI_VERSION) together with the
# newest cobol-parser that release allows, builds the 4 Nuitka mockymock
# executables from that install, packages them into the 4 platform-specific
# vsix files, attaches them to a GitHub Release on this repo, and optionally
# publishes to the VS Code Marketplace -- all in one dispatch. Nothing here
# clones the mocky-mock repo or needs a GitHub token for it.
# Replaces the old three-piece pipeline (mocky-mock's build-executables.yml
# + publish-public.yml relaying through the public cobol-mocky-mock repo,
# plus this repo's old release.yml pulling a pinned version from it).

on:
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: 'Also publish the built vsix to the VS Code Marketplace'
        required: false
        type: boolean
        default: false
      mockymock_version:
        description: 'mocky-mock release to bundle from PyPI (blank = the version this extension pins)'
        required: false
        type: string
        default: ''

env:
  MOCKYMOCK_VERSION: ${{ inputs.mockymock_version || '0.10.2' }}

permissions:
  contents: write

concurrency:
  group: build-and-release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      mockymock_version: ${{ steps.versions.outputs.mockymock }}
      cobolparser_version: ${{ steps.versions.outputs.cobolparser }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Resolve once, here, so all four matrix legs bundle the exact same
      # pair. cobol-parser is left to the resolver: the newest release
      # mocky-mock's own requirement range allows, the same thing a user's
      # `uv tool install mockymock` would get.
      - name: Resolve the mocky-mock and cobol-parser versions on PyPI
        id: versions
        run: |
          python -m pip install --upgrade pip
          pip install --dry-run --ignore-installed --report /tmp/report.json "mockymock==${MOCKYMOCK_VERSION}" \
            || { echo "::error::mockymock ${MOCKYMOCK_VERSION} could not be installed from PyPI (https://pypi.org/project/mockymock/)"; exit 1; }
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          versions = {i["metadata"]["name"].lower().replace("_", "-"): i["metadata"]["version"] for i in json.load(open("/tmp/report.json"))["install"]}
          print(f"mockymock={versions['mockymock']}")
          print(f"cobolparser={versions['cobol-parser']}")
          PY
          cat "$GITHUB_OUTPUT"

  build-cli:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: mockymock-linux-x86_64
          - os: macos-latest
            artifact: mockymock-macos-arm64
          # macos-13 (the previous Intel label) was retired Dec 2025;
          # macos-15-intel is GitHub's current Intel Mac runner, planned to
          # stay available through Aug 2027 (the last x86_64 macOS image --
          # see https://github.blog/changelog/2025-09-19-github-actions-macos-13-runner-image-is-closing-down/).
          - os: macos-15-intel
            artifact: mockymock-macos-x86_64
          - os: windows-latest
            artifact: mockymock-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      # The examples and Nuitka entry point come from this repo's own
      # checkout; the CLI itself comes from PyPI below.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install patchelf (required by Nuitka onefile mode on Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: Install mockymock and cobol-parser from PyPI
        shell: bash
        run: |
          pip install "mockymock==${{ needs.resolve.outputs.mockymock_version }}" "cobol-parser==${{ needs.resolve.outputs.cobolparser_version }}"
          python -c "import importlib.metadata as m; print('mockymock', m.version('mockymock'), '/ cobol-parser', m.version('cobol-parser'))"
      - name: Install Nuitka
        run: pip install nuitka
      - name: Build onefile executable
        shell: bash
        run: scripts/build-cli.sh "${{ matrix.artifact }}"
      # We have no Apple Developer Program cert, so this can't be a real
      # (Developer ID + notarized) signature -- but macOS requires arm64
      # binaries to carry at least an ad-hoc signature to run at all, and
      # Nuitka's onefile mode appends a payload after the Mach-O the C
      # toolchain's linker already ad-hoc-signed, which can invalidate that
      # signature's whole-file hash. Re-signing here, after Nuitka's own
      # packing, guarantees the artifact that actually ships is signed over
      # its final on-disk bytes. This does NOT satisfy Gatekeeper on its own
      # for a quarantined file -- see src/environment/macSelfHeal.ts (the
      # extension) and README.md's macOS section for the rest of that story.
      - name: Ad-hoc code-sign the macOS executable
        if: runner.os == 'macOS'
        shell: bash
        run: codesign --force --sign - --timestamp=none "cli-build/${{ matrix.artifact }}"
      - name: Smoke-test the executable
        shell: bash
        run: |
          BIN="cli-build/${{ matrix.artifact }}"
          chmod +x "$BIN" || true
          "$BIN" --help
      - name: Analyze subcommand bundles cobol-parser's CLI
        shell: bash
        run: |
          BIN="cli-build/${{ matrix.artifact }}"
          "$BIN" analyze dead-code examples/custinq/CUSTINQ.cbl --compact | head -c 200
      - name: End-to-end smoke test against a real example (Docker required)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          BIN="cli-build/${{ matrix.artifact }}"
          "$BIN" setup
          "$BIN" run examples/custinq/CUSTINQ.cbl --cut examples/custinq/CUSTINQ.cut
      - name: Dashboard serves its bundled static assets
        shell: bash
        run: |
          BIN="cli-build/${{ matrix.artifact }}"
          "$BIN" dashboard --port 8765 --no-browser &
          DASH=$!
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8765/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/ | grep -q "toolchain status"
          curl -fsS http://127.0.0.1:8765/style.css >/dev/null
          curl -fsS http://127.0.0.1:8765/app.js >/dev/null
          curl -fsS http://127.0.0.1:8765/api/status | grep -q '"checks"'
          kill "$DASH" || true

      - uses: actions/upload-artifact@v4
        with:
          name: dist-exe-${{ matrix.os }}
          path: |
            cli-build/${{ matrix.artifact }}
            cli-build/LICENSE

  # The GnuCOBOL tree the linux-x64 vsix carries under gnucobol/, so tests
  # run with no Docker (mocky-mock's native toolchain backend). Built in
  # Debian 11 so it runs on any Linux with glibc 2.31 or newer, not just on
  # whatever the current ubuntu-latest ships.
  build-gnucobol:
    runs-on: ubuntu-latest
    container: debian:11
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential libgmp-dev libdb5.3-dev curl ca-certificates xz-utils
      - uses: actions/checkout@v4
      - name: Build the relocatable GnuCOBOL tree
        run: scripts/build-gnucobol.sh gnucobol-build
      # A tarball, not the bare tree: upload-artifact drops the execute bit.
      - name: Pack it
        run: tar -C gnucobol-build -czf gnucobol-linux-x64.tar.gz gnucobol
      - uses: actions/upload-artifact@v4
        with:
          name: gnucobol-linux-x64
          path: |
            gnucobol-linux-x64.tar.gz
            gnucobol-build/gnucobol-3.2.tar.xz

  # The GnuCOBOL tree the win32-x64 vsix carries: the build the Chocolatey
  # `gnucobol` package installs (pinned URL + SHA-256, see the script). It
  # brings its own MinGW gcc, so Windows users need nothing else.
  fetch-gnucobol-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the GnuCOBOL tree
        run: scripts/fetch-gnucobol-windows.sh gnucobol-build
      - name: Pack it
        run: tar -C gnucobol-build -czf gnucobol-win32-x64.tar.gz gnucobol
      - uses: actions/upload-artifact@v4
        with:
          name: gnucobol-win32-x64
          path: gnucobol-win32-x64.tar.gz

  build-vsix:
    needs: [build-cli, build-gnucobol, fetch-gnucobol-windows]
    runs-on: ubuntu-latest
    env:
      # A plain workspace-relative path, not ${{ runner.temp }}/staging --
      # the `runner` context isn't available in a job-level `env:` block
      # (it only becomes available at the step level), so referencing it
      # here fails workflow validation ("Unrecognized named-value: 'runner'").
      STAGING_DIR: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-exe-*
          path: ${{ env.STAGING_DIR }}
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: gnucobol-linux-x64
          path: ${{ env.STAGING_DIR }}/gnucobol
      - uses: actions/download-artifact@v4
        with:
          name: gnucobol-win32-x64
          path: ${{ env.STAGING_DIR }}/gnucobol
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Create the vsce output directory
        run: mkdir -p dist
      - name: Package win32-x64
        run: |
          rm -rf bin && mkdir bin
          cp "$STAGING_DIR/mockymock-windows-amd64.exe" bin/mockymock.exe
          cp "$STAGING_DIR/LICENSE" bin/LICENSE-mockymock
          rm -rf gnucobol
          tar -xzf "$STAGING_DIR/gnucobol/gnucobol-win32-x64.tar.gz"
          npx @vscode/vsce package --target win32-x64 -o dist/
          rm -rf gnucobol
          unzip -l dist/*win32-x64*.vsix | grep -q 'extension/bin/mockymock.exe' || { echo "win32-x64 package missing bundled binary" >&2; exit 1; }
          unzip -l dist/*win32-x64*.vsix | grep -q 'extension/gnucobol/bin/cobc.exe$' || { echo "win32-x64 package missing bundled GnuCOBOL" >&2; exit 1; }
          if unzip -l dist/*win32-x64*.vsix | grep -q 'extension/gnucobol/bin/cobc$'; then
            echo "win32-x64 package contains the linux GnuCOBOL tree" >&2
            exit 1
          fi
          if unzip -l dist/*win32-x64*.vsix | grep -qE 'extension/bin/mockymock$|extension/staging/'; then
            echo "win32-x64 package contains a foreign-platform binary or staging leakage" >&2
            exit 1
          fi
      - name: Package linux-x64
        run: |
          rm -rf bin && mkdir bin
          cp "$STAGING_DIR/mockymock-linux-x86_64" bin/mockymock
          chmod +x bin/mockymock
          cp "$STAGING_DIR/LICENSE" bin/LICENSE-mockymock
          rm -rf gnucobol
          tar -xzf "$STAGING_DIR/gnucobol/gnucobol-linux-x64.tar.gz"
          npx @vscode/vsce package --target linux-x64 -o dist/
          rm -rf gnucobol
          unzip -l dist/*linux-x64*.vsix | grep -q 'extension/bin/mockymock$' || { echo "linux-x64 package missing bundled binary" >&2; exit 1; }
          unzip -l dist/*linux-x64*.vsix | grep -q 'extension/gnucobol/bin/cobc$' || { echo "linux-x64 package missing bundled GnuCOBOL" >&2; exit 1; }
          if unzip -l dist/*linux-x64*.vsix | grep -qE 'extension/bin/mockymock\.exe$|extension/staging/'; then
            echo "linux-x64 package contains a foreign-platform binary or staging leakage" >&2
            exit 1
          fi
      - name: Package darwin-arm64
        run: |
          rm -rf bin && mkdir bin
          cp "$STAGING_DIR/mockymock-macos-arm64" bin/mockymock
          chmod +x bin/mockymock
          cp "$STAGING_DIR/LICENSE" bin/LICENSE-mockymock
          npx @vscode/vsce package --target darwin-arm64 -o dist/
          unzip -l dist/*darwin-arm64*.vsix | grep -q 'extension/bin/mockymock$' || { echo "darwin-arm64 package missing bundled binary" >&2; exit 1; }
          if unzip -l dist/*darwin-arm64*.vsix | grep -q 'extension/gnucobol/'; then
            echo "darwin-arm64 package contains the linux GnuCOBOL tree" >&2
            exit 1
          fi
          if unzip -l dist/*darwin-arm64*.vsix | grep -qE 'extension/bin/mockymock\.exe$|extension/staging/'; then
            echo "darwin-arm64 package contains a foreign-platform binary or staging leakage" >&2
            exit 1
          fi
      - name: Package darwin-x64
        run: |
          rm -rf bin && mkdir bin
          cp "$STAGING_DIR/mockymock-macos-x86_64" bin/mockymock
          chmod +x bin/mockymock
          cp "$STAGING_DIR/LICENSE" bin/LICENSE-mockymock
          npx @vscode/vsce package --target darwin-x64 -o dist/
          unzip -l dist/*darwin-x64*.vsix | grep -q 'extension/bin/mockymock$' || { echo "darwin-x64 package missing bundled binary" >&2; exit 1; }
          if unzip -l dist/*darwin-x64*.vsix | grep -q 'extension/gnucobol/'; then
            echo "darwin-x64 package contains the linux GnuCOBOL tree" >&2
            exit 1
          fi
          if unzip -l dist/*darwin-x64*.vsix | grep -qE 'extension/bin/mockymock\.exe$|extension/staging/'; then
            echo "darwin-x64 package contains a foreign-platform binary or staging leakage" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-vsix
          path: dist/*.vsix

  release:
    needs: [build-vsix, resolve]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-vsix
          path: dist/
      # The GPL's corresponding source for the bundled GnuCOBOL binaries:
      # the exact tarball they were built from, on the same release page.
      - uses: actions/download-artifact@v4
        with:
          name: gnucobol-linux-x64
          path: gnucobol/
      - name: Resolve the release tag from this repo's own package.json
        id: tag
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Verify HEAD is exactly tagged with the resolved release tag
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          git fetch --tags --force
          ACTUAL="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          if [ "$ACTUAL" != "$TAG" ]; then
            echo "::error::HEAD is not tagged $TAG (git describe says '${ACTUAL:-<none>}'). Dispatch this workflow with 'Use workflow from' set to the $TAG tag, not a branch — release-please must have already cut that tag."
            exit 1
          fi
      - name: Create the release if it doesn't exist yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --generate-notes
      - name: Upload the vsix files (clobber lets a re-dispatch replace a bad build)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.tag.outputs.tag }}" dist/*.vsix gnucobol/gnucobol-build/gnucobol-3.2.tar.xz --clobber
      - name: Record the mocky-mock and cobol-parser releases this vsix was built from
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          MOCKYMOCK_VERSION="${{ needs.resolve.outputs.mockymock_version }}"
          COBOLPARSER_VERSION="${{ needs.resolve.outputs.cobolparser_version }}"
          BODY="$(gh release view "$TAG" --json body -q .body)"
          [ "$BODY" = "null" ] && BODY=""
          LINE1="Built from mocky-mock ${MOCKYMOCK_VERSION} (PyPI)."
          LINE2="Uses cobol-parser ${COBOLPARSER_VERSION} (PyPI)."
          # Strip any provenance lines a prior dispatch of this same release
          # already recorded before re-adding the current ones. mocky-mock or
          # cobol-parser can cut a new release between re-dispatches (e.g. a
          # re-run to fix a bad build), so appending only when the exact line
          # is missing would leave the old (now-wrong) tag recorded alongside
          # the new one -- always rewrite instead of conditionally appending.
          STRIPPED="$(printf '%s\n' "$BODY" | grep -Ev '^Built from mocky-mock |^Uses cobol-parser ' | awk 'NF{blank=0} !NF{blank++} blank<2')"
          NEW_BODY="$(printf '%s\n\n%s\n%s' "$STRIPPED" "$LINE1" "$LINE2")"
          if [ "$NEW_BODY" != "$BODY" ]; then
            printf '%s' "$NEW_BODY" | gh release edit "$TAG" --notes-file -
          fi

  publish-marketplace:
    needs: release
    if: ${{ inputs.publish_marketplace }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist-vsix
          path: dist/
      - name: Publish each platform vsix to the Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          shopt -s nullglob
          for f in dist/*.vsix; do
            echo "Publishing $f"
            npx @vscode/vsce publish --packagePath "$f"
          done
